name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch makes the running build pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# A clean machine on every push, driven by the same scripts as the README's
# Quick start: when a step breaks for a new user, it breaks here first. The
# quick build: the agent, its web UI, the tray and the tests, with no MAUI
# workloads to install; the MAUI client has a build of its own (client.yml).
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      # The prerequisites a user installs from docs/developer/prerequisites.md.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The NuGet packages of the last build with the same projects and
      # versions, so a push downloads only what changed.
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # No private file on CI, as on a fresh clone: every one is absent.
      - name: Check private files
        run: .\check-private.ps1

      - name: Build and test
        run: .\build.ps1 -Configuration Release -NoClient

      # A build must not change what git tracks.
      - name: Nothing tracked changed
        run: |
          $changed = git status --porcelain --untracked-files=no
          if ($changed) { $changed; throw "The build changed tracked files." }
