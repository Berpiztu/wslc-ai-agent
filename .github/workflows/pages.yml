name: GitHub Pages

# Publishes on GitHub Pages the app's own interactive architecture diagrams,
# straight from where the app serves them, so the README can link to them (a
# README cannot run the diagrams' JavaScript itself), and install.ps1, the
# one-line installer the README runs with `irm ... | iex`.
on:
  push:
    branches: [main]
    paths:
      - src/WslcAgent.UI/wwwroot/archify/**
      - install.ps1
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Gather the diagrams and the installer
        run: |
          mkdir -p _site/architecture
          cp src/WslcAgent.UI/wwwroot/archify/*.html _site/architecture/
          cp install.ps1 _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
