# The publishing proxy's image (plugins/wslc-published: nginx and the login in
# front of the published names), built and pushed to ghcr.io/berpiztu/wslc-published
# by hand only (Actions -> "Published proxy image" -> Run workflow, with its
# version): the image changes seldom and on its own clock, not the agent's releases.
# The agent's Set up runs it, and Update image on the proxy brings a newer one: what
# it keeps (access.json, its session secret) is a folder of the host, not the image.
name: Published proxy image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.0)"
        required: true
      latest:
        description: "Publish it as latest too"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/berpiztu/wslc-published

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: plugins/wslc-published
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ inputs.version }}
            ${{ inputs.latest && format('{0}:latest', env.IMAGE) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=WSLC AI Agent's publishing proxy: nginx and a login in front of the published names
          cache-from: type=gha,scope=wslc-published
          cache-to: type=gha,mode=max,scope=wslc-published
