# The publishing proxy's image (plugins/wslc-published: nginx and the login in
# front of the published names), built and pushed to ghcr.io/berpiztu/wslc-published
# at every release tag, as the agent's own version and latest; or by hand.
# The agent's Set up runs it, and Update image on the proxy brings a newer one: what
# it keeps (access.json, its session secret) is a folder of the host, not the image.
name: Published proxy image

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag besides latest (e.g. 1.0.30)"
        required: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/berpiztu/wslc-published

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: plugins/wslc-published
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.value }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=WSLC AI Agent's publishing proxy: nginx and a login in front of the published names
          cache-from: type=gha,scope=wslc-published
          cache-to: type=gha,mode=max,scope=wslc-published
