# A web page that counts its visits: an app built from ./app, and Redis to
# keep the count. The tutorial is README.md, beside this file.
name: counter

services:
  web:
    build: ./app
    ports:
      - "8000:8000"
    environment:
      REDIS_HOST: redis
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    volumes:
      - data:/data

volumes:
  data:
