<?xml version="1.0" encoding="UTF-8"?>
<!-- App icon background: a soft slate-to-indigo gradient on a rounded square.
     MAUI composes appiconfg.svg on top and also uses this for Android's
     adaptive-icon background. -->
<svg xmlns="http://www.w3.org/2000/svg" width="456" height="456" viewBox="0 0 456 456">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.25" r="0.8">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="456" height="456" rx="96" fill="url(#bg)"/>
  <rect width="456" height="456" rx="96" fill="url(#glow)"/>
</svg>
